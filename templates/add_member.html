{% extends "base.html" %}
{% set active = "arrears" %}
{% block title %}명단 추가{% endblock %}
{% block page_title %}명단 추가{% endblock %}
{% block content %}
<div class="page-header"><a href="/arrears" class="btn btn-ghost btn-sm" style="margin-left:auto;">취소</a></div>
<div class="card" style="max-width:750px;">
  <form method="post" action="/member_add">
    <div class="form-grid" style="margin-bottom:16px;">
      <div class="fg"><label>성명 *</label><input type="text" name="name" required></div>
      <div class="fg"><label>차량번호</label><input type="text" name="vehicle_no"></div>
      <div class="fg"><label>지역</label><input type="text" name="region" list="rl2"><datalist id="rl2">{% for r in regions %}<option value="{{ r }}">{% endfor %}</datalist></div>
      <div class="fg"><label>계정</label><select name="account"><option value="협">협회비</option><option value="관">관리비</option></select></div>
      <div class="fg"><label>핸드폰</label><input type="text" name="mobile"></div>
      <div class="fg"><label>미수금액</label><input type="number" name="amount" value="0" min="0"></div>
      <div class="fg" style="grid-column:span 2;"><label>주소</label><input type="text" name="address"></div>
      <div class="fg" style="grid-column:span 2;"><label>비고</label><textarea name="note" rows="2"></textarea></div>
    </div>
    <button type="submit" class="btn btn-primary">저장</button>
  </form>
</div>
{% endblock %}
